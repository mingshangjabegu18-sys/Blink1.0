<svg viewBox="0 0 850 260" width="100%" height="260" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Living Sunset Sky Gradient -->
    <linearGradient id="sunsetSky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f172a">
        <animate attributeName="stop-color" values="#0f172a;#1e1b4b;#0f172a" dur="8s" repeatCount="indefinite"/>
      </stop>
      <stop offset="45%" stop-color="#4c1d95">
        <animate attributeName="stop-color" values="#4c1d95;#7e22ce;#4c1d95" dur="8s" repeatCount="indefinite"/>
      </stop>
      <stop offset="80%" stop-color="#ea580c"/>
      <stop offset="100%" stop-color="#f97316"/>
    </linearGradient>

    <!-- Glowing Sun -->
    <radialGradient id="sunGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fef08a" stop-opacity="1"/>
      <stop offset="50%" stop-color="#f97316" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#ea580c" stop-opacity="0"/>
    </radialGradient>

    <!-- Eye Clip Path for Smooth Blinking -->
    <clipPath id="eyeClip">
      <path d="M 355 130 Q 425 75 495 130 Q 425 185 355 130 Z">
        <animate attributeName="d"
          values="
            M 355 130 Q 425 75 495 130 Q 425 185 355 130 Z;
            M 355 130 Q 425 75 495 130 Q 425 185 355 130 Z;
            M 355 130 Q 425 130 495 130 Q 425 130 355 130 Z;
            M 355 130 Q 425 75 495 130 Q 425 185 355 130 Z;
            M 355 130 Q 425 75 495 130 Q 425 185 355 130 Z"
          keyTimes="0; 0.45; 0.48; 0.52; 1"
          dur="4.5s"
          repeatCount="indefinite"/>
      </path>
    </clipPath>
  </defs>

  <!-- Sky Background -->
  <rect width="850" height="260" rx="16" fill="url(#sunsetSky)"/>

  <!-- Setting Sun -->
  <circle cx="425" cy="185" r="95" fill="url(#sunGlow)">
    <animate attributeName="cy" values="185;198;185" dur="8s" repeatCount="indefinite"/>
  </circle>
  <circle cx="425" cy="185" r="46" fill="#fed7aa" opacity="0.9">
    <animate attributeName="cy" values="185;198;185" dur="8s" repeatCount="indefinite"/>
  </circle>

  <!-- Horizon Water Reflection -->
  <path d="M 0 195 Q 212 185 425 195 T 850 195 L 850 260 L 0 260 Z" fill="#090d16" opacity="0.85"/>
  <path d="M 0 205 Q 212 215 425 205 T 850 205 L 850 260 L 0 260 Z" fill="#030712"/>

  <!-- Blinking Eye Centerpiece -->
  <g clip-path="url(#eyeClip)">
    <!-- Sclera -->
    <rect x="350" y="75" width="150" height="110" fill="#fff7ed"/>
    <!-- Sunset Iris -->
    <g>
      <animateTransform attributeName="transform" type="translate" values="-8,0; 8,0; 0,0; -8,0" dur="6s" repeatCount="indefinite"/>
      <circle cx="425" cy="130" r="24" fill="#ea580c"/>
      <circle cx="425" cy="130" r="17" fill="#7c2d12"/>
      <!-- Pupil -->
      <circle cx="425" cy="130" r="9" fill="#090d16"/>
      <!-- Light Catchlight -->
      <circle cx="431" cy="123" r="4" fill="#ffffff"/>
    </g>
  </g>

  <!-- Eye Outline -->
  <path d="M 355 130 Q 425 75 495 130 Q 425 185 355 130 Z" fill="none" stroke="#fdba74" stroke-width="2.5">
    <animate attributeName="d"
      values="
        M 355 130 Q 425 75 495 130 Q 425 185 355 130 Z;
        M 355 130 Q 425 75 495 130 Q 425 185 355 130 Z;
        M 355 130 Q 425 130 495 130 Q 425 130 355 130 Z;
        M 355 130 Q 425 75 495 130 Q 425 185 355 130 Z;
        M 355 130 Q 425 75 495 130 Q 425 185 355 130 Z"
      keyTimes="0; 0.45; 0.48; 0.52; 1"
      dur="4.5s"
      repeatCount="indefinite"/>
  </path>

  <!-- Title Overlay -->
  <text x="425" y="46" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="2">
    MINGSHANG JABEGU
  </text>
  <text x="425" y="236" font-family="monospace" font-size="13" fill="#fdba74" text-anchor="middle" letter-spacing="1.5">
    BLINKING THROUGH SUNSET • TOKYO
  </text>
</svg>

